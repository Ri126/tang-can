<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tăng cân">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2457d6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Sổ tăng cân 56 → 65kg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#14253a;--mute:#5d6f84;--line:#d5dee8;--acc:#2457d6;--accT:#fff;--ok:#1f9d6b;--okBg:#e1f4ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1823;--card:#16263a;--ink:#e8eef6;--mute:#8fa3ba;--line:#26394f;--acc:#6b95ff;--accT:#0e1823;--ok:#43c696;--okBg:#12372d}}
:root[data-theme="dark"]{--bg:#0e1823;--card:#16263a;--ink:#e8eef6;--mute:#8fa3ba;--line:#26394f;--acc:#6b95ff;--accT:#0e1823;--ok:#43c696;--okBg:#12372d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:500 13px inherit;font-family:inherit;padding:9px 2px;white-space:nowrap;border-radius:9px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--accT);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:40px;font-weight:800;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.row .t{flex:1}.row .t b{display:block}.row .t span{color:var(--mute);font-size:14px}
.row .k{color:var(--mute);font-size:14px;white-space:nowrap}
.row.done .t b{text-decoration:line-through;color:var(--mute)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--okBg);color:var(--ok)}
.pill.rest{background:var(--line);color:var(--mute)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary input{width:22px;height:22px;accent-color:var(--ok);flex:none}
summary .t{flex:1}summary .t b{display:block}summary .t span{color:var(--mute);font-size:14px}
summary:after{content:"+";font-size:22px;color:var(--mute)}
details[open] summary:after{content:"–"}
details ul{margin:10px 0 2px 32px;padding:0;color:var(--ink)}
details li{margin-bottom:6px;font-size:15px}
.in{display:flex;gap:8px;margin-top:10px}
.in input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;background:var(--acc);color:var(--accT);font:700 15px inherit;font-family:inherit;padding:10px 16px;border-radius:10px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px;color:var(--mute)}
.week div{padding:6px 0;border-radius:8px;border:1px solid var(--line)}
.week .on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.week .today{border-color:var(--acc);color:var(--ink);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:13px;border-top:0}
td button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.note{font-size:14px;color:var(--mute);margin:8px 0 0}
svg{width:100%;height:auto;display:block}
.hide{display:none}
.tb td,.tb th{vertical-align:top;font-size:14px}
.tb td:first-child{font-weight:700;white-space:nowrap;padding-right:8px}
.bw{height:8px;background:var(--acc);border-radius:4px;min-width:2px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0}
.ln span:last-child{color:var(--mute);white-space:nowrap}
h2{font-size:17px;margin:0 0 8px}
ol.st{margin:10px 0 2px 24px;padding:0}ol.st li{margin-bottom:6px;font-size:15px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh b{font-size:18px}.mh button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--mute);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.cal .g{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.cal .y{background:var(--okBg);color:var(--ok);font-weight:700}
.cal .o{border-color:var(--acc);color:var(--acc)}
.cal .f{opacity:.35}
.cal .t{border-width:2px;border-color:var(--acc)}
.cal .d i{font-style:normal;font-size:9px;position:absolute;bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sg b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.sg span{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Sổ tăng cân</h1>
<p class="sub">56kg → 65kg · mục tiêu ~2.600 kcal và ~100g đạm mỗi ngày</p>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="a">Hôm nay</button>
<button role="tab" aria-selected="false" data-t="b">Tập</button>
<button role="tab" aria-selected="false" data-t="c">Cân nặng</button>
<button role="tab" aria-selected="false" data-t="d">Tháng</button>
<button role="tab" aria-selected="false" data-t="e">Thực đơn</button>
</nav>

<section id="a"></section>
<section id="b" class="hide"></section>
<section id="c" class="hide"></section>
<section id="d" class="hide"></section>
<section id="e" class="hide"></section>
</main>

<script>
var MEALS=[
["Sáng","3 trứng luộc hoặc hấp + 1-2 bát cơm (hoặc 1 ổ bánh mì) + 1 chuối",600],
["Trưa","2 bát cơm + đạm luộc/hấp (gà, thịt, cá) + rau luộc, xem tab Thực đơn",700],
["Xế","1 ổ bánh mì phết bơ đậu phộng",350],
["Tối","2 bát cơm + đậu phụ hoặc trứng hoặc cá, thịt + rau luộc/canh",700],
["Trước ngủ","1 hộp sữa nhỏ 180ml + 1 nắm lạc rang",250]];
var EX=[
{n:"Hít đất",s:"3 hiệp × 8-15 lần (gần hết sức)",c:["Hai tay rộng hơn vai một chút, thân thẳng từ đầu đến gót.","Hạ ngực sát sàn trong 3 giây, khuỷu tay chếch khoảng 45° so với thân.","Đẩy lên, không võng lưng, không chổng mông. Chưa làm nổi thì chống gối."]},
{n:"Squat",s:"3 hiệp × 15-20 lần",c:["Chân rộng bằng vai, mũi chân hơi xoay ra ngoài.","Đẩy mông ra sau như ngồi xuống ghế, lưng thẳng, ngực mở, mắt nhìn phía trước.","Gối đi theo hướng mũi chân, gót không nhấc. Xuống tới khi đùi song song sàn rồi đứng lên bằng gót."]},
{n:"Kéo tạ (row)",s:"3 hiệp × 10-12 lần mỗi tay",c:["Tay cầm tạ đơn hoặc can nước, gập hông khoảng 45°, lưng thẳng.","Kéo khuỷu tay về phía hông, siết bả vai 1 giây ở điểm cao nhất.","Hạ chậm trong 2-3 giây, không dùng đà người."]},
{n:"Đẩy vai kiểu chữ V (pike push-up)",s:"3 hiệp × 8-12 lần",c:["Chống tay và chân, nâng mông cao thành hình chữ V ngược.","Hạ đỉnh đầu xuống sàn giữa hai tay, khuỷu tay mở nhẹ ra ngoài.","Đẩy lên bằng vai, giữ chân gần thẳng và lưng không võng."]},
{n:"Plank",s:"3 hiệp × 30-45 giây",c:["Khuỷu tay ngay dưới vai, thân thẳng từ đầu đến gót.","Siết bụng và mông, không để hông võng hoặc chổng lên.","Thở đều, không nín thở."]}];
var KEY="tangcan_v1",S={days:{},w:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.days)S.days={};if(!S.w)S.w=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return n<10?"0"+n:""+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var now=new Date(),TK=key(now),DOW=now.getDay();
var TRAIN=[1,3,5];
function day(k){if(!S.days[k])S.days[k]={m:[],e:[]};return S.days[k]}
function $(id){return document.getElementById(id)}

function renderA(){
var d=day(TK),kc=0,n=0;
MEALS.forEach(function(m,i){if(d.m[i]){kc+=m[2];n++}});
var pct=Math.min(100,Math.round(kc/2600*100));
var h='<div class="card"><div class="big"><b>'+kc+'</b><span>/ 2.600 kcal</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
h+='<p class="note">Đã ăn '+n+'/'+MEALS.length+' bữa. Ăn đủ bữa quan trọng hơn ăn thật nhiều một bữa.</p></div>';
h+='<div class="card">';
MEALS.forEach(function(m,i){
h+='<label class="row'+(d.m[i]?' done':'')+'"><input type="checkbox" data-m="'+i+'"'+(d.m[i]?' checked':'')+'><span class="t"><b>'+m[0]+'</b><span>'+m[1]+'</span></span><span class="k">'+m[2]+' kcal</span></label>'});
h+='</div>';
var tr=TRAIN.indexOf(DOW)>-1,ed=d.e.filter(Boolean).length;
h+='<div class="card"><span class="pill'+(tr?'':' rest')+'">'+(tr?'Hôm nay có buổi tập':'Hôm nay nghỉ tập')+'</span>';
h+='<p style="margin:8px 0 0">'+(tr?'Xong '+ed+'/'+EX.length+' bài. Vào tab Buổi tập để xem cách làm.':'Ngủ đủ 7-8 tiếng để cơ phục hồi. Thứ 2, 4, 6 là ngày tập.')+'</p>';
h+='<div class="week">';
var mon=new Date(now);mon.setDate(now.getDate()-((DOW+6)%7));
var names=["T2","T3","T4","T5","T6","T7","CN"];
for(var i=0;i<7;i++){var x=new Date(mon);x.setDate(mon.getDate()+i);var dk=day(key(x));var c=dk.e.filter(Boolean).length>=3;
h+='<div class="'+(c?'on ':'')+(key(x)===TK?'today':'')+'">'+names[i]+'</div>'}
h+='</div><p class="note">Ô xanh = ngày đã làm xong ít nhất 3 bài tập.</p></div>';
$("a").innerHTML=h;
$("a").querySelectorAll("input[data-m]").forEach(function(el){el.onchange=function(){d.m[+el.dataset.m]=el.checked;save();renderA()}})}

function renderB(){
var d=day(TK);
var h='<div class="card"><b>Lịch tập: Thứ 2, 4, 6</b><p class="note" style="margin-top:4px">Nghỉ 60-90 giây giữa các hiệp. Mỗi tuần cố thêm 1-2 lần hoặc tập chậm hơn để cơ luôn bị thử thách.</p></div><div class="card">';
EX.forEach(function(x,i){
h+='<details><summary><input type="checkbox" data-e="'+i+'"'+(d.e[i]?' checked':'')+' aria-label="Đã tập '+x.n+'"><span class="t"><b>'+x.n+'</b><span>'+x.s+'</span></span></summary><ul>';
x.c.forEach(function(c){h+='<li>'+c+'</li>'});h+='</ul></details>'});
h+='</div><p class="note">Tích vào ô vuông để đánh dấu bài đã làm xong hôm nay.</p>';
$("b").innerHTML=h;
$("b").querySelectorAll("input[data-e]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation()};el.onchange=function(){d.e[+el.dataset.e]=el.checked;save();renderA()}})}

function chart(){
var W=Object.keys(S.w).length?S.w.slice().sort(function(a,b){return a.d<b.d?-1:1}):[];
if(W.length<1)return '';
var lo=54,hi=66,w=300,h=150,px=28,py=14;
function Y(v){return py+(hi-v)/(hi-lo)*(h-2*py)}
function X(i){return W.length===1?w/2:px+i*(w-px-10)/(W.length-1)}
var p=W.map(function(r,i){return X(i)+","+Y(r.w)}).join(" ");
var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Biểu đồ cân nặng">';
[56,60,65].forEach(function(v){s+='<line x1="'+px+'" x2="'+(w-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" '+(v===65?'stroke-dasharray="4 3"':'')+'/><text x="2" y="'+(Y(v)+4)+'" font-size="10" fill="var(--mute)">'+v+'</text>'});
s+='<polyline points="'+p+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
W.forEach(function(r,i){s+='<circle cx="'+X(i)+'" cy="'+Y(r.w)+'" r="3.5" fill="var(--acc)"/>'});
return s+'</svg><p class="note">Đường nét đứt là mốc 65kg.</p>'}

function renderC(){
var W=S.w.slice().sort(function(a,b){return a.d<b.d?1:-1});
var last=W.length?W[0].w:56;
var pct=Math.max(0,Math.min(100,Math.round((last-56)/9*100)));
var h='<div class="card"><div class="big"><b>'+last+'</b><span>kg · còn '+Math.max(0,(65-last)).toFixed(1)+'kg tới 65kg</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
h+='<div class="in"><input id="wi" type="number" step="0.1" min="30" max="150" inputmode="decimal" placeholder="Cân nặng sáng nay (kg)" aria-label="Cân nặng"><button class="btn" id="wb">Lưu</button></div>';
h+='<p class="note">Cân mỗi sáng sau khi đi vệ sinh, cùng giờ. Sau 2 tuần không tăng thì thêm 1 bát cơm hoặc 1 ly sữa mỗi ngày.</p></div>';
var c=chart();if(c)h+='<div class="card">'+c+'</div>';
if(W.length){h+='<div class="card"><table><tr><th>Ngày</th><th>Cân nặng</th><th></th></tr>';
W.slice(0,30).forEach(function(r){h+='<tr><td>'+r.d.split("-").reverse().join("/")+'</td><td>'+r.w+' kg</td><td><button data-del="'+r.d+'" aria-label="Xoá">×</button></td></tr>'});
h+='</table></div>'}
$("c").innerHTML=h;
$("wb").onclick=function(){var v=parseFloat($("wi").value);if(!(v>=30&&v<=150))return;
S.w=S.w.filter(function(r){return r.d!==TK});S.w.push({d:TK,w:Math.round(v*10)/10});save();renderC()};
$("c").querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){S.w=S.w.filter(function(r){return r.d!==b.dataset.del});save();renderC()}})}


var VM=new Date(now.getFullYear(),now.getMonth(),1);
function renderD(){
var y=VM.getFullYear(),m=VM.getMonth(),dim=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7;
var full=0,tr=0,kcs=0,lg=0,pl=0,past=0,cells="";
["T2","T3","T4","T5","T6","T7","CN"].forEach(function(n){cells+='<div class="h">'+n+'</div>'});
for(var e=0;e<first;e++)cells+='<div></div>';
for(var i=1;i<=dim;i++){
var k=y+"-"+pad(m+1)+"-"+pad(i),dk=S.days[k],ml=dk?dk.m.filter(Boolean).length:0,ex=dk?dk.e.filter(Boolean).length:0;
var dt=new Date(y,m,i),fut=k>TK,w=dt.getDay();
if(TRAIN.indexOf(w)>-1)pl++;
if(!fut)past++;
if(ml>0){lg++;MEALS.forEach(function(q,j){if(dk.m[j])kcs+=q[2]})}
if(ml>=MEALS.length)full++;
if(ex>=3)tr++;
var c=ml>=MEALS.length?"g":ml>=3?"y":ml>0?"o":"";
cells+='<div class="d '+c+(fut?" f":"")+(k===TK?" t":"")+'">'+i+(ex>=3?'<i>●</i>':'')+'</div>'}
var pre=y+"-"+pad(m+1)+"-",ws=S.w.filter(function(r){return r.d.indexOf(pre)===0}).sort(function(a,b){return a.d<b.d?-1:1});
var wtxt="Chưa có",wsub="Nhập ở tab Cân nặng";
if(ws.length){var a=ws[0].w,z=ws[ws.length-1].w,df=Math.round((z-a)*10)/10;wtxt=z+" kg";wsub=ws.length>1?"Đầu tháng "+a+" kg ("+(df>=0?"+":"")+df+" kg)":"Mới có 1 lần cân"}
var h='<div class="mh"><button id="pm" aria-label="Tháng trước">‹</button><b>Tháng '+(m+1)+'/'+y+'</b><button id="nm" aria-label="Tháng sau">›</button></div>';
h+='<div class="card"><div class="cal">'+cells+'</div><div class="legend"><span>Xanh đậm: ăn đủ 5 bữa</span><span>Xanh nhạt: 3-4 bữa</span><span>Viền xanh: 1-2 bữa</span><span>● tập từ 3 bài</span></div></div>';
h+='<div class="card"><div class="sg">';
h+='<div><b>'+full+'/'+past+'</b><span>ngày ăn đủ 5 bữa</span></div>';
h+='<div><b>'+tr+'/'+pl+'</b><span>buổi tập (theo lịch T2-4-6)</span></div>';
h+='<div><b>'+(lg?Math.round(kcs/lg).toLocaleString("vi-VN"):"0")+'</b><span>kcal trung bình/ngày (mục tiêu 2.600)</span></div>';
h+='<div><b>'+wtxt+'</b><span>'+wsub+'</span></div>';
h+='</div></div>';
$("d").innerHTML=h;
$("pm").onclick=function(){VM=new Date(y,m-1,1);renderD()};
$("nm").onclick=function(){VM=new Date(y,m+1,1);renderD()}}

var FIX=[["Trứng gà","3 quả",10,"Trứng"],["Chuối","1-2 quả",3,"Bánh mì, bơ, chuối"],["Bánh mì không","1 ổ",5,"Bánh mì, bơ, chuối"],["Bơ đậu phộng","1-2 muỗng",2,"Bánh mì, bơ, chuối"],["Sữa hộp nhỏ 180ml","1 hộp",7,"Sữa, lạc"],["Lạc rang","1 nắm ~30g",3,"Sữa, lạc"],["Gạo","~0,4kg",8,"Gạo"],["Gia vị (mắm, muối, dầu, hành, tỏi, gừng)","dùng dần",2,"Gia vị"]];
var DAYS=[
{n:"Thứ 2",l:"Gà luộc gừng + rau muống luộc",t:"Đậu phụ hấp + rau luộc",i:[["Đùi gà","1 chiếc ~250g",17,"Thịt, cá, gà"],["Đậu phụ","2 bìa",7,"Đậu phụ"],["Rau muống","1 bó",6,"Rau, khoai"]]},
{n:"Thứ 3",l:"Trứng hấp hành + rau luộc",t:"Đậu phụ luộc + canh rau",i:[["Trứng thêm","2 quả",7,"Trứng"],["Đậu phụ","2 bìa",7,"Đậu phụ"],["Rau cải","1 bó",6,"Rau, khoai"]]},
{n:"Thứ 4",l:"Cá hấp gừng + rau luộc",t:"Đậu phụ luộc + canh rau",i:[["Cá rô phi","1 con ~300g",15,"Thịt, cá, gà"],["Đậu phụ","2 bìa",7,"Đậu phụ"],["Rau","1 bó",6,"Rau, khoai"]]},
{n:"Thứ 5",l:"Canh thịt băm rau cải",t:"2 trứng luộc + khoai lang luộc",i:[["Thịt băm","60g",8,"Thịt, cá, gà"],["Rau cải","1 bó",6,"Rau, khoai"],["Trứng thêm","2 quả",7,"Trứng"],["Khoai lang","1 củ",4,"Rau, khoai"]]},
{n:"Thứ 6",l:"Thịt ba chỉ nạc luộc + rau luộc",t:"Đậu phụ hấp",i:[["Thịt ba chỉ nạc","120g",16,"Thịt, cá, gà"],["Đậu phụ","2 bìa",7,"Đậu phụ"],["Rau","1 bó",6,"Rau, khoai"]]},
{n:"Thứ 7",l:"Gà luộc + rau luộc",t:"Khoai lang luộc + canh rau",i:[["Đùi gà","1 chiếc ~250g",17,"Thịt, cá, gà"],["Rau","1 bó",6,"Rau, khoai"],["Khoai lang","1 củ",4,"Rau, khoai"]]},
{n:"Chủ nhật",l:"Cá hấp gừng + rau luộc",t:"Đậu phụ hấp + canh rau",i:[["Cá rô phi","1 con ~300g",15,"Thịt, cá, gà"],["Đậu phụ","2 bìa",7,"Đậu phụ"],["Rau","1 bó",6,"Rau, khoai"]]}];
var GROUPS=["Trứng","Gạo","Thịt, cá, gà","Đậu phụ","Rau, khoai","Sữa, lạc","Bánh mì, bơ, chuối","Gia vị"];
var NUOC="Nước chấm: 2 muỗng nước mắm + 1 muỗng đường + tỏi băm + ớt + 2 muỗng nước ấm + vài giọt chanh. Pha mỗi bữa, dùng trong ngày.";
var GUIDE=[
["Nấu cơm và hấp cùng một nồi",["Vo gạo 2-3 lần, cho nước vừa ngập gạo khoảng 1 đốt ngón tay, cắm nấu.","Khi nước bắt đầu sôi, đặt vỉ hấp hoặc bát lên trên để hấp trứng, đậu phụ, khoai lang.","Cơm chín thì đồ hấp cũng chín. Lấy ra ăn ngay, đừng để qua đêm."]],
["Trứng luộc",["Cho trứng vào nồi, đổ nước lạnh ngập trứng, đun sôi rồi hạ lửa nhỏ.","Luộc 9-10 phút cho chín kỹ, vớt ra ngâm nước lạnh 2 phút cho dễ bóc.","Ăn trong ngày, không để sang hôm sau."]],
["Trứng hấp hành",["Đánh 2 trứng với khoảng 4 muỗng canh nước, thêm chút muối hoặc nước mắm và hành lá.","Đổ vào bát, đậy đĩa hoặc màng bọc, hấp lửa nhỏ 10-12 phút đến khi mặt trứng đông.","Ăn nóng với cơm."]],
["Thịt ba chỉ nạc luộc",["Đun nước sôi với chút muối, hành hoặc gừng đập dập.","Cho nguyên miếng thịt 120-150g vào, sôi lại thì hạ lửa nhỏ, luộc 15-20 phút đến khi chọc đũa không còn nước hồng.","Vớt ra, thái lát chấm nước chấm. Giữ nước luộc để nấu canh trong bữa đó."]],
["Gà luộc gừng (đùi gà)",["Chà đùi gà với muối và gừng, rửa lại.","Cho vào nước sôi, hạ lửa nhỏ, luộc 20-25 phút đến khi chọc vào chỗ dày nhất không ra nước hồng.","Chấm muối tiêu chanh hoặc nước chấm. Phải chín kỹ."]],
["Cá hấp gừng",["Rửa sạch cá, khía vài đường, ướp muối và gừng thái sợi 5-10 phút.","Hấp trên nồi nước sôi 12-15 phút (cá ~300g) cho thật chín.","Ăn nóng với nước mắm gừng, chấm cùng rau luộc."]],
["Đậu phụ hấp hoặc luộc",["Luộc: cho đậu phụ vào nước sôi có chút muối, 3-5 phút. Hấp: 8-10 phút.","Vớt ra, cắt miếng, chấm nước tương hoặc nước chấm tỏi ớt.","Mua đậu phụ trong ngày, đừng để qua đêm."]],
["Rau luộc",["Đun nước sôi, thêm chút muối và vài giọt dầu cho rau xanh.","Cho rau vào: rau muống khoảng 2 phút, rau cải 2-3 phút. Vớt ngay, đừng để nhũn.","Chấm nước mắm tỏi hoặc nước tương."]],
["Canh thịt băm rau cải",["Ướp 60g thịt băm với chút muối và hành, đun nước sôi rồi cho thịt vào khuấy cho tơi.","Sôi lại vài phút, cho rau cải cắt khúc, nêm muối hoặc nước mắm.","Tắt bếp sau 2-3 phút để rau còn xanh."]],
["Canh rau (dùng nước luộc)",["Đun nước sôi với chút muối, cho rau cắt khúc vào, nấu 2-3 phút.","Nêm nước mắm, có thể thêm hành lá. Nấu và ăn ngay."]],
["Khoai lang luộc",["Rửa sạch, cho cả củ vào nước lạnh, đun sôi rồi hạ lửa nhỏ.","Luộc 20-25 phút (củ vừa) đến khi đũa xuyên qua dễ. Hoặc hấp trong nồi cơm.","Ăn thay một phần cơm vào bữa tối."]]];
function sm(a){return a.reduce(function(t,x){return t+x[2]},0)}
function renderE(){
var fx=sm(FIX),tot=0,gp={},mx=0;
DAYS.forEach(function(d){d.c=fx+sm(d.i);tot+=d.c;if(d.c>mx)mx=d.c;FIX.concat(d.i).forEach(function(x){gp[x[3]]=(gp[x[3]]||0)+x[2]})});
var mon=(tot*30/7/1000).toFixed(2).replace(".",",");
var h='<div class="card"><div class="big"><b>~'+tot+'k</b><span>mỗi tuần · khoảng '+mon+' triệu/tháng</span></div>';
h+='<p class="note">Giá chỉ là ước tính ở chợ Hà Nội, có thể lệch 10% tùy nơi mua. Nếu cao hơn thì cắt bơ đậu phộng hoặc đổi bớt bữa gà sang trứng, đậu phụ.</p></div>';
h+='<div class="card"><h2>Thực đơn tuần (luộc, hấp)</h2><table class="tb"><tr><th>Ngày</th><th>Trưa</th><th>Tối</th></tr>';
DAYS.forEach(function(d){h+='<tr><td>'+d.n+'</td><td>'+d.l+'</td><td>'+d.t+'</td></tr>'});
h+='</table><p class="note">Ăn cố định mỗi ngày: sáng (3 trứng + cơm hoặc bánh mì + chuối), xế (bánh mì phết bơ đậu phộng), trước ngủ (1 hộp sữa nhỏ + nắm lạc). Cơm mỗi bữa chính 2 bát.</p></div>';
h+='<div class="card"><h2>Đi chợ theo ngày</h2><p class="note" style="margin:0 0 6px">Không có tủ lạnh nên mua trong ngày: sáng mua đạm và rau cho bữa trưa, chiều mua cho bữa tối.</p>';
h+='<details><summary><span class="t"><b>Mua cố định mỗi ngày</b><span>'+fx+'k/ngày</span></span></summary><div style="margin-top:8px">';
FIX.forEach(function(x){h+='<div class="ln"><span>'+x[0]+' · '+x[1]+'</span><span>'+x[2]+'k</span></div>'});
h+='</div></details>';
DAYS.forEach(function(d){h+='<details><summary><span class="t"><b>'+d.n+'</b><span>Mua thêm '+sm(d.i)+'k</span></span></summary><div style="margin-top:8px">';
d.i.forEach(function(x){h+='<div class="ln"><span>'+x[0]+' · '+x[1]+'</span><span>'+x[2]+'k</span></div>'});
h+='</div></details>'});
h+='</div>';
h+='<div class="card"><h2>Thống kê chi phí</h2><table class="tb"><tr><th>Ngày</th><th style="width:55%"></th><th>Tổng</th></tr>';
DAYS.forEach(function(d){h+='<tr><td>'+d.n+'</td><td><div class="bw" style="width:'+Math.round(d.c/mx*100)+'%"></div></td><td>'+d.c+'k</td></tr>'});
h+='<tr><td>Cả tuần</td><td></td><td><b>'+tot+'k</b></td></tr></table>';
h+='<table class="tb" style="margin-top:14px"><tr><th>Nhóm</th><th>Chi phí/tuần</th><th>Tỷ lệ</th></tr>';
GROUPS.forEach(function(g){var v=gp[g]||0;h+='<tr><td>'+g+'</td><td>'+v+'k</td><td>'+Math.round(v/tot*100)+'%</td></tr>'});
h+='</table><p class="note">Ước tính dinh dưỡng trung bình khoảng 2.500-2.700 kcal và 95-105g đạm mỗi ngày. Những ngày ít thịt thì ăn đủ 2 bát cơm mỗi bữa và đủ trứng để bù.</p></div>';
h+='<div class="card"><h2>Hướng dẫn nấu</h2><p class="note" style="margin:0 0 6px">'+NUOC+'</p>';
GUIDE.forEach(function(g){h+='<details><summary><span class="t"><b>'+g[0]+'</b></span></summary><ol class="st">';
g[1].forEach(function(x){h+='<li>'+x+'</li>'});h+='</ol></details>'});
h+='</div><div class="card"><h2>Lưu ý khi không có tủ lạnh</h2><ul style="margin:0;padding-left:20px;font-size:15px"><li>Chỉ nấu đủ ăn trong bữa. Cơm, trứng luộc, rau, canh thừa qua đêm thì bỏ.</li><li>Thịt, cá, gà phải chín kỹ, không còn nước hồng.</li><li>Thấy mùi chua, nhớt hoặc lạ thì bỏ ngay.</li><li>Trứng sống, gạo, khoai lang, chuối, lạc rang, bơ đậu phộng mua tích trữ được.</li></ul></div>';
$("e").innerHTML=h}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
["a","b","c","d","e"].forEach(function(id){$(id).classList.toggle("hide",id!==b.dataset.t)});
if(b.dataset.t==="a")renderA();if(b.dataset.t==="c")renderC();if(b.dataset.t==="d")renderD()}});
renderA();renderB();renderC();renderD();renderE();
</script>
</body>
</html>
