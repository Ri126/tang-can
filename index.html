<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tăng cân">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2457d6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Sổ tăng cân 56 → 65kg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#14253a;--mute:#5d6f84;--line:#d5dee8;--acc:#2457d6;--accT:#fff;--ok:#1f9d6b;--okBg:#e1f4ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1823;--card:#16263a;--ink:#e8eef6;--mute:#8fa3ba;--line:#26394f;--acc:#6b95ff;--accT:#0e1823;--ok:#43c696;--okBg:#12372d}}
:root[data-theme="dark"]{--bg:#0e1823;--card:#16263a;--ink:#e8eef6;--mute:#8fa3ba;--line:#26394f;--acc:#6b95ff;--accT:#0e1823;--ok:#43c696;--okBg:#12372d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:500 15px inherit;font-family:inherit;padding:9px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--accT);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:40px;font-weight:800;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.row .t{flex:1}.row .t b{display:block}.row .t span{color:var(--mute);font-size:14px}
.row .k{color:var(--mute);font-size:14px;white-space:nowrap}
.row.done .t b{text-decoration:line-through;color:var(--mute)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--okBg);color:var(--ok)}
.pill.rest{background:var(--line);color:var(--mute)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary input{width:22px;height:22px;accent-color:var(--ok);flex:none}
summary .t{flex:1}summary .t b{display:block}summary .t span{color:var(--mute);font-size:14px}
summary:after{content:"+";font-size:22px;color:var(--mute)}
details[open] summary:after{content:"–"}
details ul{margin:10px 0 2px 32px;padding:0;color:var(--ink)}
details li{margin-bottom:6px;font-size:15px}
.in{display:flex;gap:8px;margin-top:10px}
.in input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;background:var(--acc);color:var(--accT);font:700 15px inherit;font-family:inherit;padding:10px 16px;border-radius:10px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px;color:var(--mute)}
.week div{padding:6px 0;border-radius:8px;border:1px solid var(--line)}
.week .on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.week .today{border-color:var(--acc);color:var(--ink);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:13px;border-top:0}
td button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.note{font-size:14px;color:var(--mute);margin:8px 0 0}
svg{width:100%;height:auto;display:block}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Sổ tăng cân</h1>
<p class="sub">56kg → 65kg · mục tiêu ~2.600 kcal và ~100g đạm mỗi ngày</p>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="a">Hôm nay</button>
<button role="tab" aria-selected="false" data-t="b">Buổi tập</button>
<button role="tab" aria-selected="false" data-t="c">Cân nặng</button>
</nav>

<section id="a"></section>
<section id="b" class="hide"></section>
<section id="c" class="hide"></section>
</main>

<script>
var MEALS=[
["Sáng","3 trứng + 1 bát cơm hoặc bánh mì + 1 chuối",600],
["Trưa","2 bát cơm + 150-200g thịt (gà, heo nạc, cá) + rau",700],
["Xế","500ml sữa tươi + 1 nắm lạc hoặc bánh mì phết bơ đậu phộng",450],
["Tối","2 bát cơm + thịt/cá + 1 miếng đậu phụ hoặc 1-2 trứng",700],
["Trước ngủ","1 ly sữa tươi hoặc 1 hộp sữa chua",150]];
var EX=[
{n:"Hít đất",s:"3 hiệp × 8-15 lần (gần hết sức)",c:["Hai tay rộng hơn vai một chút, thân thẳng từ đầu đến gót.","Hạ ngực sát sàn trong 3 giây, khuỷu tay chếch khoảng 45° so với thân.","Đẩy lên, không võng lưng, không chổng mông. Chưa làm nổi thì chống gối."]},
{n:"Squat",s:"3 hiệp × 15-20 lần",c:["Chân rộng bằng vai, mũi chân hơi xoay ra ngoài.","Đẩy mông ra sau như ngồi xuống ghế, lưng thẳng, ngực mở, mắt nhìn phía trước.","Gối đi theo hướng mũi chân, gót không nhấc. Xuống tới khi đùi song song sàn rồi đứng lên bằng gót."]},
{n:"Kéo tạ (row)",s:"3 hiệp × 10-12 lần mỗi tay",c:["Tay cầm tạ đơn hoặc can nước, gập hông khoảng 45°, lưng thẳng.","Kéo khuỷu tay về phía hông, siết bả vai 1 giây ở điểm cao nhất.","Hạ chậm trong 2-3 giây, không dùng đà người."]},
{n:"Đẩy vai kiểu chữ V (pike push-up)",s:"3 hiệp × 8-12 lần",c:["Chống tay và chân, nâng mông cao thành hình chữ V ngược.","Hạ đỉnh đầu xuống sàn giữa hai tay, khuỷu tay mở nhẹ ra ngoài.","Đẩy lên bằng vai, giữ chân gần thẳng và lưng không võng."]},
{n:"Plank",s:"3 hiệp × 30-45 giây",c:["Khuỷu tay ngay dưới vai, thân thẳng từ đầu đến gót.","Siết bụng và mông, không để hông võng hoặc chổng lên.","Thở đều, không nín thở."]}];
var KEY="tangcan_v1",S={days:{},w:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.days)S.days={};if(!S.w)S.w=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return n<10?"0"+n:""+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var now=new Date(),TK=key(now),DOW=now.getDay();
var TRAIN=[1,3,5];
function day(k){if(!S.days[k])S.days[k]={m:[],e:[]};return S.days[k]}
function $(id){return document.getElementById(id)}

function renderA(){
var d=day(TK),kc=0,n=0;
MEALS.forEach(function(m,i){if(d.m[i]){kc+=m[2];n++}});
var pct=Math.min(100,Math.round(kc/2600*100));
var h='<div class="card"><div class="big"><b>'+kc+'</b><span>/ 2.600 kcal</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
h+='<p class="note">Đã ăn '+n+'/'+MEALS.length+' bữa. Ăn đủ bữa quan trọng hơn ăn thật nhiều một bữa.</p></div>';
h+='<div class="card">';
MEALS.forEach(function(m,i){
h+='<label class="row'+(d.m[i]?' done':'')+'"><input type="checkbox" data-m="'+i+'"'+(d.m[i]?' checked':'')+'><span class="t"><b>'+m[0]+'</b><span>'+m[1]+'</span></span><span class="k">'+m[2]+' kcal</span></label>'});
h+='</div>';
var tr=TRAIN.indexOf(DOW)>-1,ed=d.e.filter(Boolean).length;
h+='<div class="card"><span class="pill'+(tr?'':' rest')+'">'+(tr?'Hôm nay có buổi tập':'Hôm nay nghỉ tập')+'</span>';
h+='<p style="margin:8px 0 0">'+(tr?'Xong '+ed+'/'+EX.length+' bài. Vào tab Buổi tập để xem cách làm.':'Ngủ đủ 7-8 tiếng để cơ phục hồi. Thứ 2, 4, 6 là ngày tập.')+'</p>';
h+='<div class="week">';
var mon=new Date(now);mon.setDate(now.getDate()-((DOW+6)%7));
var names=["T2","T3","T4","T5","T6","T7","CN"];
for(var i=0;i<7;i++){var x=new Date(mon);x.setDate(mon.getDate()+i);var dk=day(key(x));var c=dk.e.filter(Boolean).length>=3;
h+='<div class="'+(c?'on ':'')+(key(x)===TK?'today':'')+'">'+names[i]+'</div>'}
h+='</div><p class="note">Ô xanh = ngày đã làm xong ít nhất 3 bài tập.</p></div>';
$("a").innerHTML=h;
$("a").querySelectorAll("input[data-m]").forEach(function(el){el.onchange=function(){d.m[+el.dataset.m]=el.checked;save();renderA()}})}

function renderB(){
var d=day(TK);
var h='<div class="card"><b>Lịch tập: Thứ 2, 4, 6</b><p class="note" style="margin-top:4px">Nghỉ 60-90 giây giữa các hiệp. Mỗi tuần cố thêm 1-2 lần hoặc tập chậm hơn để cơ luôn bị thử thách.</p></div><div class="card">';
EX.forEach(function(x,i){
h+='<details><summary><input type="checkbox" data-e="'+i+'"'+(d.e[i]?' checked':'')+' aria-label="Đã tập '+x.n+'"><span class="t"><b>'+x.n+'</b><span>'+x.s+'</span></span></summary><ul>';
x.c.forEach(function(c){h+='<li>'+c+'</li>'});h+='</ul></details>'});
h+='</div><p class="note">Tích vào ô vuông để đánh dấu bài đã làm xong hôm nay.</p>';
$("b").innerHTML=h;
$("b").querySelectorAll("input[data-e]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation()};el.onchange=function(){d.e[+el.dataset.e]=el.checked;save();renderA()}})}

function chart(){
var W=Object.keys(S.w).length?S.w.slice().sort(function(a,b){return a.d<b.d?-1:1}):[];
if(W.length<1)return '';
var lo=54,hi=66,w=300,h=150,px=28,py=14;
function Y(v){return py+(hi-v)/(hi-lo)*(h-2*py)}
function X(i){return W.length===1?w/2:px+i*(w-px-10)/(W.length-1)}
var p=W.map(function(r,i){return X(i)+","+Y(r.w)}).join(" ");
var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Biểu đồ cân nặng">';
[56,60,65].forEach(function(v){s+='<line x1="'+px+'" x2="'+(w-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" '+(v===65?'stroke-dasharray="4 3"':'')+'/><text x="2" y="'+(Y(v)+4)+'" font-size="10" fill="var(--mute)">'+v+'</text>'});
s+='<polyline points="'+p+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
W.forEach(function(r,i){s+='<circle cx="'+X(i)+'" cy="'+Y(r.w)+'" r="3.5" fill="var(--acc)"/>'});
return s+'</svg><p class="note">Đường nét đứt là mốc 65kg.</p>'}

function renderC(){
var W=S.w.slice().sort(function(a,b){return a.d<b.d?1:-1});
var last=W.length?W[0].w:56;
var pct=Math.max(0,Math.min(100,Math.round((last-56)/9*100)));
var h='<div class="card"><div class="big"><b>'+last+'</b><span>kg · còn '+Math.max(0,(65-last)).toFixed(1)+'kg tới 65kg</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
h+='<div class="in"><input id="wi" type="number" step="0.1" min="30" max="150" inputmode="decimal" placeholder="Cân nặng sáng nay (kg)" aria-label="Cân nặng"><button class="btn" id="wb">Lưu</button></div>';
h+='<p class="note">Cân mỗi sáng sau khi đi vệ sinh, cùng giờ. Sau 2 tuần không tăng thì thêm 1 bát cơm hoặc 1 ly sữa mỗi ngày.</p></div>';
var c=chart();if(c)h+='<div class="card">'+c+'</div>';
if(W.length){h+='<div class="card"><table><tr><th>Ngày</th><th>Cân nặng</th><th></th></tr>';
W.slice(0,30).forEach(function(r){h+='<tr><td>'+r.d.split("-").reverse().join("/")+'</td><td>'+r.w+' kg</td><td><button data-del="'+r.d+'" aria-label="Xoá">×</button></td></tr>'});
h+='</table></div>'}
$("c").innerHTML=h;
$("wb").onclick=function(){var v=parseFloat($("wi").value);if(!(v>=30&&v<=150))return;
S.w=S.w.filter(function(r){return r.d!==TK});S.w.push({d:TK,w:Math.round(v*10)/10});save();renderC()};
$("c").querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){S.w=S.w.filter(function(r){return r.d!==b.dataset.del});save();renderC()}})}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
["a","b","c"].forEach(function(id){$(id).classList.toggle("hide",id!==b.dataset.t)});
if(b.dataset.t==="a")renderA();if(b.dataset.t==="c")renderC()}});
renderA();renderB();renderC();
</script>
</body>
</html>
